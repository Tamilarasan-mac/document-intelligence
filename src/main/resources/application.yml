spring:
  main:
    banner-mode: off
  application:
    name: document-intelligence

  datasource:
    url: jdbc:postgresql://localhost:5432/document_db
    username: document_user
    password: document_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:3b
          temperature: 0.2
      embedding:
        model: nomic-embed-text
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW
    mcp:
      server:
        name: document-intelligence-server
        version: 1.0.0
        type: SYNC
        stdio: true
        annotation-scanner:
          enabled: true

app:
  security:
    api-key: ${DOCUMENT_API_KEY:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
  level:
    root: WARN
